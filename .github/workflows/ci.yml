name: CI

on:
  push:
    branches: [main, phase-15-advanced-statistical-models]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Next.js production build
        run: NEXT_TELEMETRY_DISABLED=1 npm run build

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'python/requirements*.txt'

      - name: Install runtime dependencies
        run: pip install -r python/requirements.txt

      - name: Install dev dependencies
        run: pip install -r python/requirements-dev.txt

      - name: Ruff lint check
        run: ruff check python/

      - name: Mypy type check
        run: mypy python/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}

  vercel_preview:
    name: Deploy Phase 15 preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/phase-15-advanced-statistical-models'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Phase 15 branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy preview to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN secret is not configured" && exit 1)
          npx vercel@latest link --yes --project football-prediction --scope team_cWUseE8FzXljjb64dxsJPsva --token "$VERCEL_TOKEN"
          npx vercel@latest deploy --yes --scope team_cWUseE8FzXljjb64dxsJPsva --token "$VERCEL_TOKEN"
