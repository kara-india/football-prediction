name: Phase 15 Historical Benchmark

on:
  push:
    branches:
      - phase-15-advanced-statistical-models
  workflow_dispatch:
    inputs:
      league:
        description: "Historical league code"
        required: true
        default: "E0"

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'chore(phase-15): run benchmark'
    name: E0 Walk-Forward Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Install dependencies
        run: python -m pip install -r python/requirements.txt

      - name: Run real-data benchmark
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BENCHMARK_LEAGUE: ${{ github.event.inputs.league || 'E0' }}
          BENCHMARK_FILE: phase15-benchmark-${{ github.event.inputs.league || 'E0' }}.json
          BENCHMARK_LEAGUE: ${{ github.event.inputs.league || 'E0' }}
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL secret is not configured" && exit 1)
          test -n "$SUPABASE_SECRET_KEY" || (echo "SUPABASE_SECRET_KEY secret is not configured" && exit 1)
          python -m python.backtesting.advanced_historical_benchmark --league "$BENCHMARK_LEAGUE" > phase15-benchmark-$BENCHMARK_LEAGUE.json

      - name: Build concise benchmark summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path(__import__("os").environ["BENCHMARK_FILE"]).read_text())
          lines = [
              "# Phase 15 Historical Benchmark Results",
              f"Status: {result.get('status')}",
              f"Data window: {result['data_window']['first_match']} to {result['data_window']['last_match']}",
              f"Historical matches fetched: {result['data_window']['matches']}",
              "",
              "## Candidate summaries",
          ]
          for name, summary in result.get("candidate_summaries", {}).items():
              lines.extend([
                  f"### {name}",
                  f"- Samples: {summary['sample_size']}",
                  f"- Home-win Brier: {summary['home_win_brier']:.6f}",
                  f"- Home-win LogLoss: {summary['home_win_log_loss']:.6f}",
                  f"- Over 2.5 Brier: {summary['over25_brier']:.6f}",
                  f"- Over 2.5 LogLoss: {summary['over25_log_loss']:.6f}",
                  f"- Home-win ECE: {summary['home_win_ece']:.6f}",
                  f"- Over 2.5 ECE: {summary['over25_ece']:.6f}",
                  "",
              ])
          lines.extend([
              "## Goal distribution selections",
              "```text",
              json.dumps(result.get("total_goal_distribution_selections", {}), indent=2),
              "```",
          ])
          Path("phase15-summary.md").write_text("\n".join(lines))
          PY

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase15-benchmark-e0
          path: |
            phase15-benchmark-${{ github.event.inputs.league || 'E0' }}.json
            phase15-summary.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish summary to Phase 15 PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = context.ref.replace('refs/heads/', '');
            const head = context.repo.owner + ':' + branch;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head,
              state: 'open'
            });
            const pr = prs.find(p => p.number === 9);
            if (!pr) {
              core.setFailed('Phase 15 PR #9 was not found for branch ' + head);
              return;
            }
            const summary = fs.readFileSync('phase15-summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: summary
            });
