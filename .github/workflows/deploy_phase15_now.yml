name: Deploy Phase 15 Preview

on:
  push:
    branches:
      - main
    paths:
      - '.github/deploy_phase15_now.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Phase 15 branch to Vercel Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Phase 15 branch
        uses: actions/checkout@v4
        with:
          ref: phase-15-advanced-statistical-models

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN secret is not configured" && exit 1)

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel@latest link --yes --project prj_03lWkgNWURyAyKYN7DNwUt2mlPNF --scope team_cWUseE8FzXljjb64dxsJPsva --token "$VERCEL_TOKEN"

      - name: Pull preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN" --scope team_cWUseE8FzXljjb64dxsJPsva

      - name: Build Vercel output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel@latest build --token "$VERCEL_TOKEN"

      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel@latest deploy --prebuilt --token "$VERCEL_TOKEN" --scope team_cWUseE8FzXljjb64dxsJPsva
