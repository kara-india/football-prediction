name: Background Collector
on:
  # Cron paused until Phase 9 to prevent premature execution and protect API quota
  # schedule:
  #   - cron: '0 4 * * *'  # Once daily at 04:00 UTC in Phase 9 (strictly 1 credit)
  workflow_dispatch:  # Manual on-demand trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r python/requirements.txt
      - name: Run collector worker
        run: python -m python.workers.collector_worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ENGINE_CHECK_SETTINGS: 'true'
