name: Autonomous Background Workers

on:
  schedule:
    # Discovery: daily at 04:00 UTC
    - cron: '0 4 * * *'
    # Lineup Watcher: every 15 minutes during match windows
    - cron: '*/15 * * * *'
    # Evaluator: hourly
    - cron: '0 * * * *'
    # Learner: daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Worker job to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - discovery
          - lineups
          - analysis
          - evaluator
          - learner
          - live
          - all
      dry_run:
        description: 'Run in simulation dry-run mode'
        required: false
        default: false
        type: boolean

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Determine Target Worker Job
        id: job_selector
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ github.event.inputs.job }}"
            DRY_RUN="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          else
            CRON="${{ github.event.schedule }}"
            DRY_RUN=""
            case "$CRON" in
              "0 4 * * *")   JOB="discovery" ;;
              "0 2 * * *")   JOB="learner" ;;
              "0 * * * *")   JOB="evaluator" ;;
              "*/15 * * * *") JOB="lineups" ;;
              *)             JOB="all" ;;
            esac
          fi
          echo "target_job=$JOB" >> $GITHUB_OUTPUT
          echo "dry_run_flag=$DRY_RUN" >> $GITHUB_OUTPUT

      - name: Execute Background Worker
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          python -m python.workers.runner ${{ steps.job_selector.outputs.target_job }} ${{ steps.job_selector.outputs.dry_run_flag }}
