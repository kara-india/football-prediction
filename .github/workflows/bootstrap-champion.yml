name: Bootstrap Champion Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-15-advanced-statistical-models
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      - name: Train and persist Champion
        env:
          SUPABASE_URL: https://qqcxjjkgvqknesrtnwal.supabase.co
          SUPABASE_SECRET_KEY: ''
          SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_MWK1XOnTtdc4MsagVnYHHw_qJUNnqsh'
        run: python scripts/train_champion_artifact.py
