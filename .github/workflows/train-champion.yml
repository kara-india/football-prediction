name: Train Champion Artifact

on:
  workflow_dispatch:
  push:
    branches: [phase-15-advanced-statistical-models]
    paths:
      - 'python/**'
      - 'scripts/train_champion_artifact.py'
      - '.github/workflows/train-champion.yml'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      - name: Train validated Champion artifact
        env:
          SUPABASE_URL: https://qqcxjjkgvqknesrtnwal.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python scripts/train_champion_artifact.py
      - name: Commit artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add python/models/champion_artifact.json
          git diff --cached --quiet || git commit -m 'chore: refresh validated Champion artifact'
          git push
